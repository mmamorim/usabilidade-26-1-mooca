<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 1 - Aula 8</title>
</head>

<body>

    <h1>Exercício 1 - Aula 8</h1>

    <div style="margin: 5px 5px 5px 5px">
        Salário: <input id="caixaSalario" type="text" />
    </div>
    <div>
        <button onclick="calcular()">Calcular Reajuste</button>
    </div>
    <div style="border: 1px solid black; padding: 8px 8px 8px 8px;">
        Seu Salário reajustado é:
        <span id="resposta" style="font-weight: 900;">
            sem resposta ainda...
        </span>
    </div>

    <script>

        function calcular() {

            let elem = document.getElementById("caixaSalario")
            // console.log("Elem: ",elem);
            let salario = parseFloat(elem.value)

            if(salario < 2000) {
                salario = salario * 1.5
            }
            if(salario >= 2000 && salario < 5000) {
                salario = salario * 1.2
            }
            if(salario >= 5000) {
                salario = salario * 1.1
            }

            console.log("Seu novo Salário é ",salario)



        }

    </script>


</body>

</html>
